name: Build Firefox Extension

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build clean zip
        run: |
          zip -r linkedin-feed-blocker.zip . \
          -x "*.git*" ".github/*" "dist/*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linkedin-feed-blocker
          path: linkedin-feed-blocker.zip
